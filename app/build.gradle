plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'kotlin-kapt'
}

android {
    namespace 'com.clinic.callmonitor'
    compileSdk 34

    defaultConfig {
        applicationId "com.clinic.callmonitor"
        minSdk 24
        targetSdk 33
        // targetSdk متعمد يبقى 33 مش 34: من 34 جوجل بتضيق أكتر على قراءة سجل
        // المكالمات والـ Accessibility للتطبيقات اللي مش "default dialer".
        // لو هتقدم التطبيق على Google Play لازم تراجع سياسة "Permissions for
        // Call Log / Accessibility" لأنها بتتطلب موافقة خاصة من جوجل.
        // بما إن التطبيق ده للتوزيع الداخلي (APK مباشر على تليفونات الشركة)
        // مش هنحتاج موافقة Play، بس لازم توزّعه كـ APK يدوي أو عبر MDM.
        versionCode 1
        versionName "1.0"
    }

    signingConfigs {
        release {
            storeFile file(System.getenv("KEYSTORE_PATH") ?: "keystore.jks")
            storePassword System.getenv("KEYSTORE_PASSWORD")
            keyAlias System.getenv("KEY_ALIAS")
            keyPassword System.getenv("KEY_PASSWORD")
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
    buildFeatures {
        viewBinding true
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.work:work-runtime-ktx:2.9.0'

    // شبكة ورفع الملفات
    implementation 'com.squareup.retrofit2:retrofit:2.9.0'
    implementation 'com.squareup.retrofit2:converter-gson:2.9.0'
    implementation 'com.squareup.okhttp3:logging-interceptor:4.12.0'

    // تخزين محلي بسيط لحالة الرفع
    implementation 'androidx.room:room-runtime:2.6.1'
    implementation 'androidx.room:room-ktx:2.6.1'
    kapt 'androidx.room:room-compiler:2.6.1'
}
