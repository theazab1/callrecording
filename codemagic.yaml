workflows:
  android-workflow:
    name: Call Monitor Android Build (Debug)
    max_build_duration: 60
    instance_type: mac_mini_m1
    environment:
      vars:
        PACKAGE_NAME: "com.clinic.callmonitor"
      java: 17
    scripts:
      - name: Generate Gradle wrapper
        script: |
          cd $CM_BUILD_DIR
          gradle wrapper --gradle-version 8.4
      - name: Build Debug APK
        script: |
          cd $CM_BUILD_DIR
          ./gradlew assembleDebug
    artifacts:
      - app/build/outputs/apk/debug/*.apk
    publishing:
      email:
        recipients:
          - your-email@example.com
        notify:
          success: true
          failure: true
